function plan(){
 let d=BIBLE.schedule[selected-1]||BIBLE.schedule[0];
 let ds=BIBLE.schedule.filter(x=>(!query||(x.refs+' '+x.date+' '+x.day).toLowerCase().includes(query.toLowerCase()))&&(filter==='Todos'||status(x.day)===filter));
 return `${title('Plano de leitura',`${currentPlan().days} dias para percorrer toda a Bíblia, de Gênesis a Apocalipse.`)}<div class="plan-layout"><div class="card"><div class="toolbar"><input id="search" placeholder="Buscar livro, referência ou dia..." value="${escapeHtml(query)}"><select id="filter">${['Todos','Pendente','Em andamento','Concluída'].map(x=>`<option ${filter===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="list">${ds.map(x=>`<button class="day-row ${x.day===d.day?'selected':''}" data-select="${x.day}"><span class="day-no ${status(x.day)==='Concluída'?'done':''}">${status(x.day)==='Concluída'?'✓':String(x.day).padStart(2,'0')}</span><span class="row-text"><b>${x.refs}</b><small>${fmt(x.date,{weekday:'short',day:'2-digit',month:'short'})} · ${x.chapters} capítulos</small></span><span class="row-status">${status(x.day)}</span></button>`).join('')||'<div class="empty">Nenhuma leitura encontrada.</div>'}</div><p style="font-size:10px;color:var(--muted)">${ds.length} de ${currentPlan().days} dias</p></div><aside class="card detail"><span class="kicker" style="color:#87947b">DETALHES DA LEITURA</span><h2>Dia ${d.day} <small style="font:11px Arial;color:#999">/ ${currentPlan().days}</small></h2><h3>${d.refs}</h3><p>${fmt(d.date,{weekday:'long',day:'2-digit',month:'long',year:'numeric'})}</p><div class="illustration"><svg viewBox="0 0 240 115" role="img" aria-label="Bíblia aberta com ramos"><path d="M18 91 Q60 70 119 88 Q177 70 222 91 L216 105 Q170 86 120 105 Q65 86 24 105 Z" fill="#d9dfcc"/><path d="M36 35 Q78 23 119 43 L119 89 Q77 69 36 83 Z" fill="#fffdf3" stroke="#d9cda8" stroke-width="2"/><path d="M119 43 Q160 23 204 35 L204 83 Q162 69 119 89 Z" fill="#fffdf3" stroke="#d9cda8" stroke-width="2"/><path d="M119 43 V89" stroke="#b6a579" stroke-width="2"/><g stroke="#c5b895" stroke-width="2" stroke-linecap="round"><path d="M49 46 l53 10 M49 55 l53 10 M49 64 l53 10 M132 55 l57 -10 M132 64 l57 -10 M132 73 l57 -10"/></g><path d="M19 76 Q28 52 44 42 M27 62 l-12 -4 M34 52 l-1 -12 M195 80 Q208 60 224 54 M210 66 l12 1" fill="none" stroke="#82956a" stroke-width="2.5" stroke-linecap="round"/><ellipse cx="15" cy="57" rx="5" ry="10" transform="rotate(-40 15 57)" fill="#b7c7a1"/><ellipse cx="42" cy="41" rx="5" ry="10" transform="rotate(35 42 41)" fill="#b7c7a1"/><ellipse cx="222" cy="53" rx="5" ry="10" transform="rotate(40 222 53)" fill="#b7c7a1"/></svg><b style="font-weight:normal">Leia com calma.<br>Reflita com o coração.</b></div><p>Capítulos de hoje: <b>${d.chapters}</b></p><button class="btn primary wide" data-note="${d.date}">✎ Registrar aprendizado</button><button class="btn outline wide" data-toggle="${d.day}">${status(d.day)==='Concluída'?'Desmarcar leitura':'✓ Marcar como concluída'}</button><div class="pager"><button data-select="${Math.max(1,d.day-1)}" ${d.day===1?'disabled':''}>← Anterior</button><button data-select="${Math.min(currentPlan().days,d.day+1)}" ${d.day===currentPlan().days?'disabled':''}>Próximo →</button></div></aside></div>`;

function calendar(){
 let [y,m]=month.split('-').map(Number),first=new Date(y,m-1,1),offset=(first.getDay()+6)%7,count=new Date(y,m,0).getDate(),week=['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'];
 return `${title('Calendário de leitura','Veja suas leituras dia a dia e acompanhe sua constância.')}<div class="card"><div class="calendar-head"><button data-month="-1">←</button><h2>${new Date(y,m-1,15).toLocaleDateString('pt-BR',{month:'long',year:'numeric'})}</h2><button data-month="1">→</button></div><div class="legend">🟢 Concluída &nbsp; 🟡 Em andamento &nbsp; ⚪ Pendente</div><div class="cal-grid">${week.map(x=>`<b class="weekday">${x}</b>`).join('')}${Array.from({length:offset},()=>'<div></div>').join('')}${Array.from({length:count},(_,i)=>{let day=i+1,iso=`${y}-${String(m).padStart(2,'0')}-${String(day).padStart(2,'0')}`,d=BIBLE.schedule.find(x=>x.date===iso);return d?`<button class="cal-day ${status(d.day)==='Concluída'?'done':status(d.day)==='Em andamento'?'doing':''}" data-open="${d.day}"><b>${day}</b><small>${d.refs}</small><span>${status(d.day)}</span></button>`:`<div class="cal-day"><b>${day}</b></div>`}).join('')}</div></div>`;
}
function books(){
 let bs=BIBLE.books.filter(b=>b.testament===testament);
 return `${title('Livros da Bíblia','Acompanhe sua caminhada por cada livro das Escrituras.')}<div class="tabs"><button class="${testament==='AT'?'active':''}" data-testament="AT">Antigo Testamento · 39</button><button class="${testament==='NT'?'active':''}" data-testament="NT">Novo Testamento · 27</button></div><div class="book-grid">${bs.map((b,i)=>{let ds=BIBLE.schedule.filter(d=>d.groups.some(g=>g.book===b.name)),n=ds.filter(d=>status(d.day)==='Concluída').length,v=Math.round(n/ds.length*100);return `<div class="book"><span class="kicker" style="color:#89977d">${String(i+1).padStart(2,'0')} · ${b.testament==='AT'?'ANTIGO':'NOVO'} TESTAMENTO</span><h3>${b.name}</h3><p>${b.chapters} capítulos</p>${bar(v)}<div class="book-meta"><span>${v}% concluído</span><span>${n}/${ds.length} dias</span></div></div>`}).join('')}</div>`;
}
function diary(){
 let n=notes()[entryDate]||{},d=BIBLE.schedule.find(x=>x.date===entryDate);
 return `${title('Meu diário com Deus','Guarde aqui aquilo que a Palavra fala ao seu coração.')}<div class="diary-layout"><div class="card form"><h2 style="font:22px Georgia,serif;margin:0 0 8px">Minha reflexão</h2><label>Data da leitura</label><input id="entryDate" type="date" value="${entryDate}"><label>Leitura bíblica</label><input id="noteReading" value="${escapeHtml(n.reading||d?.refs||'')}" placeholder="Ex.: Gênesis 1–3"><label>Versículo favorito</label><input id="noteVerse" value="${escapeHtml(n.verse||'')}" placeholder="Referência ou trecho curto"><label>O que aprendi com essa leitura?</label><textarea id="noteLearned" rows="3" placeholder="Registre os principais ensinamentos...">${escapeHtml(n.learned||'')}</textarea><label>Como posso aplicar isso à minha vida?</label><textarea id="noteApplication" rows="3" placeholder="Uma atitude prática para hoje...">${escapeHtml(n.application||'')}</textarea><label>Dúvidas para estudar depois</label><textarea id="noteQuestions" rows="2">${escapeHtml(n.questions||'')}</textarea><label>Minha oração</label><textarea id="notePrayer" rows="3">${escapeHtml(n.prayer||'')}</textarea><button class="btn primary" id="saveNote">Salvar reflexão</button></div><aside class="card"><h3>Reflexões salvas</h3>${Object.keys(notes()).sort().reverse().map(date=>`<button class="saved" data-loadnote="${date}"><small>${fmt(date)}</small><b>${escapeHtml(notes()[date].reading||'Reflexão pessoal')}</b></button>`).join('')||'<p class="empty">Suas reflexões salvas aparecerão aqui.</p>'}</aside></div>`;
}
function statsPage(){
 let months=[...new Set(BIBLE.schedule.map(d=>d.date.slice(0,7)))];
 return `${title('Meu progresso','Cada leitura concluída é mais um passo na sua jornada.')}<div class="card progress-hero"><div><span class="kicker" style="color:#87947b">PROGRESSO GERAL</span><div class="big-pct">${progress()}%</div><p>${chaptersRead()} de 1.189 capítulos lidos</p>${bar(progress())}</div><div class="circle">${progress()}%</div></div><div class="stats">${stat('Dias concluídos',doneDays().length+'/'+currentPlan().days,'leituras finalizadas')}${stat('Capítulos lidos',chaptersRead(),'de 1.189 capítulos')}${stat('Livros completos',completedBooks(),'de 66 livros')}${stat('Dias restantes',Math.max(0,currentPlan().days-todayPlan().day),'no cronograma')}</div><h2 style="font:22px Georgia,serif">Progresso por mês</h2><div class="card">${months.map(m=>{let ds=BIBLE.schedule.filter(d=>d.date.startsWith(m)),n=ds.filter(d=>status(d.day)==='Concluída').length;return `<div class="monthbar"><span>${new Date(m+'-15T12:00:00').toLocaleDateString('pt-BR',{month:'short',year:'2-digit'})}</span><div><i style="width:${Math.round(n/ds.length*100)}%"></i></div><b>${n}/${ds.length}</b></div>`}).join('')}</div>`;
}
function plansPage(){return `${title('Meus planos de leitura','Crie diferentes jornadas, escolha quantos dias deseja e acompanhe cada progresso separadamente.')}<div class="grid2"><div class="card"><span class="kicker" style="color:#87947b">NOVO PLANO</span><h3>Personalize sua jornada</h3><p>Você pode criar vários planos para ler a Bíblia toda em ritmos diferentes. Cada plano mantém seu próprio progresso e suas reflexões.</p><div class="form"><label>Nome do plano</label><input id="newPlanName" placeholder="Ex.: Bíblia em 180 dias"><label>Em quantos dias deseja ler a Bíblia toda?</label><input id="newPlanDays" type="number" min="1" max="1189" value="180"><small style="color:var(--muted)">De 1 a 1.189 dias. Quanto menos dias, mais capítulos por dia.</small><label>Data de início</label><input id="newPlanStart" type="date" value="${localISODate()}"><button class="btn primary" id="createPlan">＋ Criar plano de leitura</button></div></div><div class="card"><span class="kicker" style="color:#87947b">SEUS PLANOS</span><h3>${saved.plans.length} plano(s) criado(s)</h3><p>Selecione um plano para abrir sua agenda e seu progresso. Os planos não compartilham marcações.</p>${saved.plans.map(p=>{let n=Object.values(p.status||{}).filter(x=>x==='Concluída').length,pct=Math.round(n/p.days*100);return `<div style="border-top:1px solid var(--line);padding:14px 0"><div style="display:flex;gap:10px;justify-content:space-between;align-items:start"><div><b>${escapeHtml(p.name)}</b><p style="margin:5px 0">${p.days} dias · início ${fmt(p.startDate)} · ${pct}% concluído</p></div>${p.id===saved.activePlanId?'<span class="tag">Plano ativo</span>':`<button class="btn outline" data-switchplan="${p.id}">Abrir plano</button>`}</div>${bar(pct)}${saved.plans.length>1&&p.id!==saved.activePlanId?`<button class="link" style="margin-top:8px;color:#a44" data-deleteplan="${p.id}">Excluir plano</button>`:''}</div>`}).join('')}</div></div><div class="notice" style="margin-top:14px">A agenda distribui os 1.189 capítulos pelos dias escolhidos, mantendo a ordem dos 66 livros. Seus dados ficam salvos neste navegador; use a área de backup para exportá-los.</div>`}
function settings(){return `${title('Backup e configurações','Mantenha suas leituras e reflexões seguras.')}<div class="settings"><div class="card setting-row"><div><h3>Exportar backup</h3><p>Baixe um arquivo com seu progresso e anotações.</p></div><button class="btn primary" id="export">↓ Exportar dados</button></div><div class="card setting-row"><div><h3>Importar backup</h3><p>Restaure um arquivo exportado anteriormente.</p></div><input id="import" type="file" accept=".json,application/json"></div><div class="notice">Os dados ficam salvos neste navegador e dispositivo. Se limpar os dados do navegador, poderá perdê-los. Exporte backups regularmente.</div></div>`}
function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function bind(){
 document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>go(b.dataset.page));
 document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openDay(BIBLE.schedule[Number(b.dataset.open)-1]));
 document.querySelectorAll('[data-select]').forEach(b=>b.onclick=()=>{selected=Number(b.dataset.select);render()});
 document.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=()=>{let d=Number(b.dataset.toggle);setStatus(d,status(d)==='Concluída'?'Pendente':'Concluída')});
 document.querySelectorAll('[data-note]').forEach(b=>b.onclick=()=>openNote(b.dataset.note));
 document.querySelectorAll('[data-month]').forEach(b=>b.onclick=()=>{let dt=new Date(month+'-15T12:00:00');dt.setMonth(dt.getMonth()+Number(b.dataset.month));month=dt.toISOString().slice(0,7);render()});
 document.querySelectorAll('[data-testament]').forEach(b=>b.onclick=()=>{testament=b.dataset.testament;render()});
 if($('#search'))$('#search').oninput=e=>{query=e.target.value;let pos=e.target.selectionStart;render();$('#search').focus();$('#search').setSelectionRange(pos,pos)};
 if($('#filter'))$('#filter').onchange=e=>{filter=e.target.value;render()};
 if($('#entryDate'))$('#entryDate').onchange=e=>{entryDate=e.target.value;render()};
 if($('#saveNote'))$('#saveNote').onclick=()=>{entryDate=$('#entryDate').value;saved.notes=saved.notes||{};saved.notes[entryDate]={reading:$('#noteReading').value,verse:$('#noteVerse').value,learned:$('#noteLearned').value,application:$('#noteApplication').value,questions:$('#noteQuestions').value,prayer:$('#notePrayer').value};persist();toast('Reflexão salva com sucesso!');render()};
 document.querySelectorAll('[data-loadnote]').forEach(b=>b.onclick=()=>openNote(b.dataset.loadnote));
 document.querySelectorAll('[data-switchplan]').forEach(b=>b.onclick=()=>switchPlan(b.dataset.switchplan));
 document.querySelectorAll('[data-deleteplan]').forEach(b=>b.onclick=()=>{if(saved.plans.length<=1){toast('Mantenha pelo menos um plano.');return}const id=b.dataset.deleteplan;if(confirm('Excluir este plano e seu progresso?')){saved.plans=saved.plans.filter(p=>p.id!==id);persist();render()}});
 if($('#createPlan'))$('#createPlan').onclick=createPlanFromForm;
 if($('#export'))$('#export').onclick=()=>{let a=document.createElement('a'),url=URL.createObjectURL(new Blob([JSON.stringify({saved},null,2)],{type:'application/json'}));a.href=url;a.download='jornada-biblica-backup.json';a.click();URL.revokeObjectURL(url);toast('Backup exportado!')};
 if($('#import'))$('#import').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let j=JSON.parse(r.result);saved=j.saved||j;if(!Array.isArray(saved.plans)||!saved.plans.length){saved.plans=[{id:'plano-original',name:'Bíblia toda em 365 dias',days:365,startDate:DEFAULT_START,status:saved.status||{},notes:saved.notes||{},schedule:BIBLE.schedule}];saved.activePlanId='plano-original'}if(!saved.plans.some(p=>p.id===saved.activePlanId))saved.activePlanId=saved.plans[0].id;BIBLE.schedule=currentPlan().schedule;saved.status=currentPlan().status||{};saved.notes=currentPlan().notes||{};persist();toast('Backup importado!');render()}catch(err){toast('Arquivo de backup inválido.')}};r.readAsText(f)};
}
$('#nav').addEventListener('click',e=>{let b=e.target.closest('[data-page]');if(b)go(b.dataset.page)});

// Preferências acessíveis e instalação como aplicativo quando o navegador oferecer suporte.
const THEME_KEY='jornada-biblica-theme';
try{const savedTheme=localStorage.getItem(THEME_KEY);if(savedTheme==='dark')document.documentElement.dataset.theme='dark'}catch(e){}
const themeButton=document.querySelector('#themeToggle');
function syncThemeButton(){if(!themeButton)return;const dark=document.documentElement.dataset.theme==='dark';themeButton.textContent=dark?'☀ Tema':'☾ Tema';themeButton.setAttribute('aria-label',dark?'Ativar tema claro':'Ativar tema escuro')}
if(themeButton)themeButton.addEventListener('click',()=>{const dark=document.documentElement.dataset.theme==='dark';if(dark)delete document.documentElement.dataset.theme;else document.documentElement.dataset.theme='dark';try{localStorage.setItem(THEME_KEY,dark?'light':'dark')}catch(e){}syncThemeButton()});syncThemeButton();
let installPrompt=null;const installButton=document.querySelector('#installApp');
window.addEventListener('beforeinstallprompt',event=>{event.preventDefault();installPrompt=event;if(installButton)installButton.hidden=false});
if(installButton)installButton.addEventListener('click',async()=>{if(!installPrompt)return;installPrompt.prompt();try{await installPrompt.userChoice}catch(e){}installPrompt=null;installButton.hidden=true});
window.addEventListener('appinstalled',()=>{if(installButton)installButton.hidden=true;toast('Jornada Bíblica instalada no dispositivo!')});
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}

render();
</script>
